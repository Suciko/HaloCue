[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "halocue"
version = "0.9.3"
description = "Narrative staging for AzureArchive"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.40,<1",
    "Pillow>=10,<13",
    "pywin32>=306; sys_platform == 'win32'",
    "pywebview==6.2.1; sys_platform == 'win32'",
    "pythonnet>=3.0.5,<4; sys_platform == 'win32'",
    "clr_loader>=0.3.1,<0.4; sys_platform == 'win32'",
    "UnityPy>=1.25.2,<2",
]

[tool.pytest.ini_options]
norecursedirs = ["backup-*", ".worktrees"]
markers = [
    "browser: requires Playwright and a locally installed Chromium browser",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "output", ".worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
