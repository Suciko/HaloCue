name: Publish HaloCue release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to publish
        required: true
        default: v1.0.0
      channel:
        description: Update channel written into the signed manifest
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from halocue_meta import VERSION; print(VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate exact tag and public seed
        run: python tools/check_release_version.py --tag "${{ inputs.release_tag }}"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Rebuild public database twice
        shell: pwsh
        run: |
          python -m release_tools.public_db --source data/halocue_labels.db --output build/db-first.db
          python -m release_tools.public_db --source data/halocue_labels.db --output build/db-second.db
          $difference = Compare-Object (Get-FileHash build/db-first.db).Hash (Get-FileHash build/db-second.db).Hash
          if ($difference) { throw 'Public database rebuild is not deterministic.' }
      - name: Export, scan, build, and verify public release
        shell: pwsh
        run: |
          python tools/export_public_source.py --source . --output build/public-source/HaloCue
          python tools/scan_release.py build/public-source/HaloCue --mode source
          python tools/verify_clean_source.py --source build/public-source/HaloCue
          python tools/build_public_release.py --source build/public-source/HaloCue --output build/releases
          python tools/scan_release.py build/releases/HaloCue --mode public
          python tools/verify_release.py "build/releases/HaloCue-${{ steps.version.outputs.version }}-windows-x64.zip"
      - name: Create signed update manifest
        shell: pwsh
        env:
          HALOCUE_UPDATE_SIGNING_KEY: ${{ secrets.HALOCUE_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:HALOCUE_UPDATE_SIGNING_KEY) { throw 'HALOCUE_UPDATE_SIGNING_KEY is not configured.' }
          python tools/build_update_manifest.py `
            --archive "build/releases/HaloCue-${{ steps.version.outputs.version }}-windows-x64.zip" `
            --archive-url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/HaloCue-${{ steps.version.outputs.version }}-windows-x64.zip" `
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}" `
            --output build/releases/update-manifest.json `
            --key-id stable-2026 `
            --channel "${{ inputs.channel }}"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prerelease = '${{ inputs.channel }}' -eq 'beta'
          $args = @(
            'release', 'create', '${{ inputs.release_tag }}', '--verify-tag',
            '--title', "HaloCue ${{ steps.version.outputs.version }}",
            '--notes-file', 'CHANGELOG.md'
          )
          if ($prerelease) { $args += '--prerelease' }
          gh @args
          gh release upload '${{ inputs.release_tag }}' `
            "build/releases/HaloCue-${{ steps.version.outputs.version }}-windows-x64.zip" `
            "build/releases/HaloCue-${{ steps.version.outputs.version }}-windows-x64.zip.sha256" `
            build/releases/update-manifest.json --clobber
