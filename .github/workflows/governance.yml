name: 1.x governance

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'CONTEXT-MAP.md'
      - 'docs/product-direction-1.x.md'
      - 'contexts/**'
      - 'docs/adr/**'
      - 'docs/agents/**'
      - '.agents/skills/**'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - '.github/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CONTEXT-MAP.md'
      - 'docs/product-direction-1.x.md'
      - 'contexts/**'
      - 'docs/adr/**'
      - 'docs/agents/**'
      - '.agents/skills/**'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  docs-and-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md CONTEXT-MAP.md CONTRIBUTING.md
            docs/product-direction-1.x.md
            docs/adr/README.md
            docs/agents/issue-tracker.md
            docs/agents/triage-labels.md
            docs/agents/domain.md
            docs/agents/long-term-memory.md
            docs/agents/skill-proposals.md
            docs/agents/skill-proposals/TEMPLATE.md
            .agents/skills/halocue-session-governance/SKILL.md
            contexts/client/CONTEXT.md
            contexts/backend/CONTEXT.md
            contexts/ba-editor/CONTEXT.md
            contexts/ai-galgame/CONTEXT.md
            packages/contracts/README.md
            packages/project-model/README.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty: $path"; exit 1; }
          done
      - name: Check required triage vocabulary
        shell: bash
        run: |
          set -euo pipefail
          for label in needs-triage needs-info ready-for-agent ready-for-human wontfix; do
            grep -q "\`$label\`" docs/agents/triage-labels.md
          done
      - name: Check Skill frontmatter and proposal boundary
        shell: bash
        run: |
          set -euo pipefail
          for skill in .agents/skills/*/SKILL.md; do
            test -s "$skill"
            grep -q '^name: ' "$skill"
            grep -q '^description: ' "$skill"
          done
          ! find docs/agents/skill-proposals -mindepth 2 -maxdepth 2 -name SKILL.md -print | grep -q .
      - name: Check clean public-boundary patterns
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|llm\.json|secrets\.json)$'
          ! git ls-files | grep -E '\.(apk|aab|7z|zip|onnx|safetensors|gguf)$'
