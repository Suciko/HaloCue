name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Run full test suite
        run: python -m pytest -q

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Validate release identity and public database
        shell: pwsh
        run: |
          python tools/check_release_version.py --tag v0.95
          python -m release_tools.public_db --source data/halocue_labels.db --output build/db-first.db
          python -m release_tools.public_db --source data/halocue_labels.db --output build/db-second.db
          $difference = Compare-Object (Get-FileHash build/db-first.db).Hash (Get-FileHash build/db-second.db).Hash
          if ($difference) { throw 'Public database rebuild is not deterministic.' }
      - name: Export and scan public source
        shell: pwsh
        run: |
          python tools/export_public_source.py --source . --output build/public-source/HaloCue
          python tools/scan_release.py build/public-source/HaloCue --mode source
          python tools/verify_clean_source.py --source build/public-source/HaloCue
      - name: Build and smoke-test public Windows archive
        shell: pwsh
        run: |
          python tools/build_public_release.py --source build/public-source/HaloCue --output build/releases
          python tools/scan_release.py build/releases/HaloCue --mode public
          python tools/verify_release.py build/releases/HaloCue-0.95-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HaloCue-0.95-windows-x64
          if-no-files-found: error
          path: |
            build/releases/HaloCue-0.95-windows-x64.zip
            build/releases/HaloCue-0.95-windows-x64.zip.sha256
