[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "halocue-production"
version = "1.0.0a1"
description = "HaloCue 1.0 script-to-AzureArchive production backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
render = ["playwright>=1.49,<2"]

[project.scripts]
halocue-production = "halocue_production.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

