[pytest]
addopts = --import-mode=importlib
testpaths =
    tests
    services/halocue/production/tests
    services/halocue/writing/tests
    services/halocue/integrated/tests
pythonpath =
    .
    services/halocue/integrated/src
    services/halocue/production/src
    services/halocue/writing/src
    services/halocue/production/tests
    services/halocue/writing/tests
norecursedirs = backup-* .worktrees
markers =
    browser: requires Playwright and a locally installed Chromium browser
    bundled_research: validates the complete shipped research database rather than the small test seed
