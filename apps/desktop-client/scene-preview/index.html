<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HaloCue scene preview</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main class="preview-shell" aria-label="HaloCue scene preview">
      <header class="preview-toolbar">
        <div>
          <p class="eyebrow">HALOCUE / SCENE PREVIEW</p>
          <h1 id="scene-title">Synthetic scene</h1>
        </div>
        <label class="font-picker">
          <span>Dialogue font</span>
          <select id="font-select" aria-label="Dialogue font">
            <option value="harmony">HarmonyOS Sans Medium</option>
            <option value="noto">Noto Sans</option>
            <option value="nowar">Nowar Rounded</option>
          </select>
        </label>
      </header>

      <section id="preview-stage" class="preview-stage" data-font="harmony" aria-live="polite">
        <div id="stage-background" class="stage-background" aria-hidden="true"></div>
        <div class="stage-floor" aria-hidden="true"></div>
        <div id="actor-layer" class="actor-layer" aria-label="Character slots"></div>
        <div class="dialogue-shade" aria-hidden="true"></div>
        <section class="dialogue-panel" aria-label="Dialogue">
          <div class="speaker-line">
            <span id="speaker-name" class="speaker-name">Scene</span>
            <span id="event-progress" class="event-progress">0 / 0</span>
          </div>
          <p id="dialogue-text" class="dialogue-text">Press advance to begin.</p>
          <div class="dialogue-footer">
            <span id="preview-status" class="preview-status">Ready</span>
            <button id="advance-button" type="button">Advance</button>
          </div>
        </section>
      </section>

      <p id="preview-error" class="preview-error" role="alert" hidden></p>
    </main>
    <script src="./preview.js"></script>
  </body>
</html>
