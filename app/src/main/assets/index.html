<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>HaloCue Android</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="mark" aria-hidden="true">H</div>
      <div>
        <p class="eyebrow">HALOCUE FOR ANDROID</p>
        <h1>手机端剧本生成</h1>
        <p class="intro">处理完成后会直接打开你安装的原版 AA。</p>
      </div>
    </header>

    <section class="status-grid" aria-label="运行状态">
      <article class="status-card">
        <span class="status-icon" id="python-dot" aria-hidden="true"></span>
        <div>
          <p class="status-label">本地处理核心</p>
          <p class="status-value" id="python-status">正在启动…</p>
        </div>
      </article>

      <article class="status-card">
        <span class="status-icon" id="aa-dot" aria-hidden="true"></span>
        <div>
          <p class="status-label">原版 AzureArchive</p>
          <p class="status-value" id="aa-status">正在检查安装状态…</p>
        </div>
      </article>
    </section>

    <section class="compiler-card" aria-labelledby="compiler-title">
      <p class="step-kicker">生成工程</p>
      <h2 id="compiler-title">生成并导入原版 AA</h2>
      <label for="project-name">工程名</label>
      <input id="project-name" type="text" value="AndroidDemo" autocomplete="off">
      <label for="script-input">剧本文本</label>
      <textarea id="script-input" rows="7" spellcheck="false">桃井: 安卓端你好</textarea>

      <p class="accessibility-note" id="accessibility-card">首次使用会引导你开启“自动导入辅助功能”。它只会在你点击下方按钮后，协助操作 vivo 文件管理器。</p>

      <button type="button" id="compile-aap">生成并导入原版 AA</button>
      <p class="compile-status" id="compile-status" aria-live="polite">尚未处理</p>
      <button type="button" class="secondary-button" id="enable-accessibility" hidden>前往开启自动导入</button>
      <button type="button" class="secondary-button" id="continue-import" hidden>继续导入</button>
    </section>

    <section class="next-step">
      <p class="step-kicker">使用说明</p>
      <h2>点一次，处理到可以使用</h2>
      <p>HaloCue 会在手机本地生成工程并导入原版 AA。只有自动导入没有完成时，才会提示你继续操作。</p>
      <button type="button" id="open-aa" disabled>打开原版 AA</button>
    </section>

    <footer>开发构建 <span id="app-version">—</span></footer>
  </main>

  <script>
    const primaryButton = document.getElementById('compile-aap');
    const status = document.getElementById('compile-status');
    const accessibilityButton = document.getElementById('enable-accessibility');
    const continueButton = document.getElementById('continue-import');

    function applyImportState(payload) {
      if (!payload || !payload.state) return;
      const state = payload.state;
      primaryButton.disabled = state === 'IMPORTING';
      accessibilityButton.hidden = payload.action !== 'open_accessibility_settings';
      continueButton.hidden = payload.action !== 'retry_import';
      status.textContent = payload.message || '尚未处理';
      status.className = 'compile-status';
      if (state === 'IMPORTED') status.classList.add('success');
      if (state === 'FAILED') status.classList.add('error');
    }

    window.HaloCueApp = {
      bootstrap(payload) {
        const python = payload.python || {};
        const aa = payload.aa || {};

        document.getElementById('python-status').textContent = python.message || '本地处理核心状态未知';
        document.getElementById('python-dot').classList.toggle('ready', python.ready === true);
        document.getElementById('aa-status').textContent = aa.message || '原版 AA 状态未知';
        document.getElementById('aa-dot').classList.toggle('ready', aa.installed === true);
        document.getElementById('app-version').textContent = payload.appVersion || '开发版';
        document.getElementById('open-aa').disabled = aa.installed !== true;
        applyImportState(payload.import);
        document.body.dataset.ready = 'true';
      },
      importUpdated(payload) {
        applyImportState(payload);
      }
    };

    primaryButton.addEventListener('click', () => {
      const project = document.getElementById('project-name').value.trim();
      const script = document.getElementById('script-input').value;
      if (!window.HaloCueNative || typeof window.HaloCueNative.generateAndImport !== 'function') {
        status.textContent = '本地处理功能尚未就绪';
        status.className = 'compile-status error';
        return;
      }
      primaryButton.disabled = true;
      accessibilityButton.hidden = true;
      continueButton.hidden = true;
      status.className = 'compile-status';
      status.textContent = '正在生成工程…';
      window.HaloCueNative.generateAndImport(project, script);
    });

    accessibilityButton.addEventListener('click', () => {
      if (window.HaloCueNative && typeof window.HaloCueNative.openImportAccessibilitySettings === 'function') {
        window.HaloCueNative.openImportAccessibilitySettings();
      }
    });

    continueButton.addEventListener('click', () => {
      continueButton.disabled = true;
      status.textContent = '正在继续导入…';
      if (window.HaloCueNative && typeof window.HaloCueNative.continueImport === 'function') {
        window.HaloCueNative.continueImport();
      }
    });

    document.getElementById('open-aa').addEventListener('click', () => {
      if (window.HaloCueNative && typeof window.HaloCueNative.openAzureArchive === 'function') {
        window.HaloCueNative.openAzureArchive();
      }
    });
  </script>
</body>
</html>
